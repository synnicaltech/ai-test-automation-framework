plugins{
    id 'java'
}

group='com.automation'
version='1.0-SNAPSHOT'

java {
    toolchain{
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories{
    mavenCentral()
}

dependencies{
    implementation libs.junit
    implementation libs.slf4j.api
    implementation libs.log4j.core
    implementation libs.rest.assured
    implementation libs.selenium.java
    implementation libs.jackson.databind
    implementation libs.log4j.slf4j2.impl
    implementation libs.json.schema.validator

    testImplementation libs.junit.engine

    testRuntimeOnly libs.junit.launcher
}

test {
    useJUnitPlatform()

    testLogging{
        events "started","passed","failed","skipped","standardOut"

        exceptionFormat="full"
        showCauses=true
        showExceptions=true
        showStackTraces=true
    }

    reports {
        html.required = true
        junitXml.required = true
    }

    systemProperty "env", System.getProperty("env", "qa")
    systemProperty "browser", System.getProperty("browser", "chrome")
    systemProperty "headless", System.getProperty("headless","true")
    systemProperty "execution.type", System.getProperty("execution.type","local")
}