#============================
# Environment
#============================

execution.type=local

#============================
# UI
#============================

base.url=http://localhost:8080
remote.url=http://localhost:4444
browser=chrome
headless=true

#============================
# UI Timeouts
#============================

implicit.wait=0
explicit.wait=30
page.load.timeout=30
script.timeout=30

#============================
# API
#============================

api.base.url=http://orangehrm:80
api.base.path=/web/index.php/api/v2

# ==========================
# API Timeouts
# ==========================

api.connection.timeout.seconds=10
api.response.timeout.seconds=30

# ==========================
# Authentication
# ==========================

api.auth.type=oauth2
api.auth.token.path=/oauth2/token